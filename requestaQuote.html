<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css\style.css">
    <script src="js\validation.js" defer></script>
    <script src="js/nav.js" defer></script>
    <title>Request A Quote - CSL Technologies</title>
</head>
<body class="home-page">
    <header class="site-header">
    <img src="images\csl final logo.png" alt="CSL Technologies logo" width="200" height="50" class="logo">
    <button type="button" class="nav-toggle" aria-expanded="false" aria-controls="site-nav" aria-label="Menu">&#9776;</button>
    <nav id="site-nav" class="site-nav">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="services.html">Services</a>
        <a href="gallery.html">Gallery</a>
        <a href="requestaQuote.html">Request a Quote</a>
    </nav>
</header>
    <h1>REQUEST A QUOTE</h1>
    <p>Please fill out the form below to request a quote for our fire and security solutions.</p>
    <form id="myForm">

        Name: <input type="text" id="name" name="name" ><br>
        <small id="nameError"></small><br>

        Email: <input type="text" id="email" name="email"><br>
        <small id="emailError"></small><br>

        Phone: <input type="text" id="phone" name="phone"><br>
        <small id="phoneError"></small><br>

        <label for="service">Service of Interest:</label>
        <select id="service" name="service">
            <option value="">Select a service</option>
            <option value="fire-alarm">Fire Alarm Systems</option>
            <option value="cctv">CCTV Surveillance</option>
            <option value="access-control">Access Control</option>
            <option value="security-consulting">Security Consulting</option>
        </select>
        <br><br>
        <small id="serviceError"></small><br>

        <label for="message">Message:</label>
        <textarea id="message" name="message" rows="5" cols="40"></textarea>
        <br><br>
        <small id="messageError"></small><br>
        <input type="submit" value="Submit">
    </form>
    <canvas id="burnCanvas"></canvas>
</body>
</html>
